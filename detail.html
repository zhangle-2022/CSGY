<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子商务专升本四班</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-container">
                <a href="index.html" class="logo">Elegant<span>Style</span></a>
                <nav>
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="category.html?category=women">女装</a></li>
                        <li><a href="category.html?category=men">男装</a></li>
                        <li><a href="category.html?category=accessories">配饰</a></li>
                        <li><a href="category.html?category=beauty">美妆</a></li>
                    </ul>
                </nav>
                <div class="header-icons">
                    <a href="#"><i class="fas fa-search"></i></a>
                    <a href="#"><i class="fas fa-user"></i></a>
                    <a href="#"><i class="fas fa-shopping-bag"></i></a>
                </div>
            </div>
        </div>
    </header>

    <div class="page-container">
        <section class="page-header">
            <div class="container">
                <h1 id="product-title">商品详情</h1>
                <div class="breadcrumb" id="product-breadcrumb">
                    <!-- 面包屑导航将通过JS动态加载 -->
                </div>
            </div>
        </section>

        <section class="product-detail">
            <div class="container">
                <div class="product-gallery">
                    <div class="main-image">
                        <img src="" alt="" id="main-product-image">
                    </div>
                    <div class="thumbnail-gallery" id="thumbnail-gallery">
                        <!-- 缩略图将通过JS动态加载 -->
                    </div>
                </div>
                <div class="product-info-detail">
                    <h1 id="detail-product-title">商品名称</h1>
                    <p class="product-price-detail" id="detail-product-price">¥0</p>
                    <div class="product-description" id="detail-product-description">
                        <!-- 商品描述将通过JS动态加载 -->
                    </div>
                    <div class="product-options">
                        <div class="option-group">
                            <label for="color-select">颜色</label>
                            <select id="color-select">
                                <!-- 颜色选项将通过JS动态加载 -->
                            </select>
                        </div>
                        <div class="option-group">
                            <label for="size-select">尺码</label>
                            <select id="detail-size-select">
                                <!-- 尺码选项将通过JS动态加载 -->
                            </select>
                        </div>
                    </div>
                    <div class="quantity-selector">
                        <button id="decrease-qty">-</button>
                        <input type="text" value="1" id="quantity">
                        <button id="increase-qty">+</button>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-add-to-cart" id="add-to-cart-btn">加入购物车</button>
                        <button class="btn btn-wishlist" id="add-to-wishlist-btn">加入收藏</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="related-products">
            <div class="container">
                <h2 class="section-title">相关产品</h2>
                <div class="product-grid" id="related-products-grid">
                    <!-- 相关产品内容将通过JS动态加载 -->
                </div>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-column">
                    <h3>关于我们</h3>
                    <ul>
                        <li><a href="#">品牌故事</a></li>
                        <li><a href="#">团队介绍</a></li>
                        <li><a href="#">招聘信息</a></li>
                        <li><a href="#">联系我们</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h3>客户服务</h3>
                    <ul>
                        <li><a href="#">常见问题</a></li>
                        <li><a href="#">配送信息</a></li>
                        <li><a href="#">退换政策</a></li>
                        <li><a href="#">隐私政策</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h3>购物指南</h3>
                    <ul>
                        <li><a href="#">尺码指南</a></li>
                        <li><a href="#">保养说明</a></li>
                        <li><a href="#">购物流程</a></li>
                        <li><a href="#">会员制度</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h3>关注我们</h3>
                    <p>订阅我们的新闻通讯，获取最新优惠和时尚资讯</p>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-weibo"></i></a>
                        <a href="#"><i class="fab fa-weixin"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-tiktok"></i></a>
                    </div>
                </div>
            </div>
            <div class="copyright">
                               <p>&copy; 电子商务专升本四班.</p>

            </div>
        </div>
    </footer>
<script src="./data.js"></script>
    <script>
        const data = websiteData;
        // 获取URL参数
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 加载数据并渲染详细页
        document.addEventListener('DOMContentLoaded', function() {
            const productId = parseInt(getUrlParameter('product')) || 1;
            
          
                    renderProductPage(data, productId);
                    setupEventListeners(data, productId);
                })
                

        // 渲染详细页
        function renderProductPage(data, productId) {
            // 获取商品信息
            const product = data.products.find(p => p.id === productId);
            if (!product) return;
            
            // 获取分类信息
            const category = data.categories.find(c => c.id === product.categoryId);
            
            // 更新页面标题
            document.title = `${product.name} - ElegantStyle`;
            
            // 更新面包屑导航
            const breadcrumb = document.getElementById('product-breadcrumb');
            breadcrumb.innerHTML = `
                <a href="index.html">首页</a>
                <span>/</span>
                <a href="category.html?category=${category.slug}">${category.name}</a>
                <span>/</span>
                <a href="detail.html?product=${product.id}">${product.name}</a>
            `;
            
            // 更新商品信息
            document.getElementById('detail-product-title').textContent = product.name;
            document.getElementById('detail-product-price').textContent = `¥${product.price}`;
            
            const descriptionElement = document.getElementById('detail-product-description');
            descriptionElement.innerHTML = `
                <p>${product.description}</p>
                <p>${product.details}</p>
            `;
            
            // 更新主图
            document.getElementById('main-product-image').src = product.images[0];
            document.getElementById('main-product-image').alt = product.name;
            
            // 更新缩略图
            const thumbnailGallery = document.getElementById('thumbnail-gallery');
            thumbnailGallery.innerHTML = '';
            
            product.images.forEach((image, index) => {
                const thumbnail = document.createElement('div');
                thumbnail.className = `thumbnail ${index === 0 ? 'active' : ''}`;
                thumbnail.setAttribute('data-image', image);
                
                thumbnail.innerHTML = `<img src="${image}" alt="${product.name}">`;
                
                thumbnailGallery.appendChild(thumbnail);
            });
            
            // 更新颜色选项
            const colorSelect = document.getElementById('color-select');
            colorSelect.innerHTML = '';
            
            product.colors.forEach(color => {
                const option = document.createElement('option');
                option.value = color;
                option.textContent = color;
                colorSelect.appendChild(option);
            });
            
            // 更新尺码选项
            const sizeSelect = document.getElementById('detail-size-select');
            sizeSelect.innerHTML = '';
            
            product.sizes.forEach(size => {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = size;
                sizeSelect.appendChild(option);
            });
            
            // 加载相关产品
            loadRelatedProducts(data.products, product.categoryId, product.id);
        }

        // 加载相关产品
        function loadRelatedProducts(products, categoryId, excludeProductId) {
            const relatedProducts = products.filter(
                product => product.categoryId === categoryId && product.id !== excludeProductId
            ).slice(0, 4);
            
            const relatedProductsGrid = document.getElementById('related-products-grid');
            relatedProductsGrid.innerHTML = '';
            
            relatedProducts.forEach(product => {
                const productCard = document.createElement('a');
                productCard.href = `detail.html?product=${product.id}`;
                productCard.className = 'product-card';
                
                productCard.innerHTML = `
                    <div class="product-image">
                        <img src="${product.images[0]}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-price">¥${product.price}</p>
                    </div>
                `;
                
                relatedProductsGrid.appendChild(productCard);
            });
        }

        // 设置事件监听器
        function setupEventListeners(data, productId) {
            // 缩略图点击事件
            document.getElementById('thumbnail-gallery').addEventListener('click', function(e) {
                const thumbnail = e.target.closest('.thumbnail');
                if (thumbnail) {
                    e.preventDefault();
                    const imageUrl = thumbnail.getAttribute('data-image');
                    document.getElementById('main-product-image').src = imageUrl;
                    
                    // 更新激活状态
                    document.querySelectorAll('.thumbnail').forEach(thumb => {
                        thumb.classList.remove('active');
                    });
                    thumbnail.classList.add('active');
                }
            });
            
            // 数量选择器事件
            document.getElementById('decrease-qty').addEventListener('click', function() {
                const quantityInput = document.getElementById('quantity');
                let currentValue = parseInt(quantityInput.value);
                if (currentValue > 1) {
                    quantityInput.value = currentValue - 1;
                }
            });
            
            document.getElementById('increase-qty').addEventListener('click', function() {
                const quantityInput = document.getElementById('quantity');
                let currentValue = parseInt(quantityInput.value);
                quantityInput.value = currentValue + 1;
            });
            
            // 加入购物车事件
            document.getElementById('add-to-cart-btn').addEventListener('click', function() {
                const quantity = document.getElementById('quantity').value;
                const color = document.getElementById('color-select').value;
                const size = document.getElementById('detail-size-select').value;
                
                alert(`商品已成功添加到购物车！\n数量: ${quantity}\n颜色: ${color}\n尺码: ${size}`);
            });
            
            // 加入收藏事件
            document.getElementById('add-to-wishlist-btn').addEventListener('click', function() {
                alert('商品已添加到收藏列表！');
            });
        }
    </script>
</body>
</html>
